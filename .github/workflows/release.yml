name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/Calculator-Keystore.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "Writing key.properties..."
            printf "%s\n" "$KEY_PROPERTIES" > android/key.properties
          else
            echo "Warning: KEY_PROPERTIES secret not found."
          fi

      - name: Analyze project source
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split per ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Package and rename release artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ] || [ -z "$TAG" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version: //' | sed 's/+.*//' | tr -d ' \r\n')
            TAG="v${VERSION}"
          fi
          echo "Packaging artifacts for tag: ${TAG}"
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/Calculator-${TAG}-universal-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/Calculator-${TAG}-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/Calculator-${TAG}-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/Calculator-${TAG}-x86_64-release.apk
          ls -la release-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
