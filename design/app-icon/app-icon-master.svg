<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="insetShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="blur" result="shadow"/>
      <feComposite operator="atop" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- LIGHT VARIANT -->
  <g id="light">
    <!-- Subtle light framing background (theme surface tone) -->
    <rect x="10" y="10" width="492" height="492" rx="56" fill="#F0F3F7"/>

    <!-- Left column tiles -->
    <g filter="url(#softShadow)">
      <rect x="62" y="68" width="184" height="184" rx="30" fill="#2D3237"/>
      <rect x="62" y="268" width="184" height="184" rx="30" fill="#2D3237"/>
    </g>
    <!-- Soft inset depth on left tiles -->
    <rect x="66" y="72" width="176" height="176" rx="26" fill="#36393F" opacity="0.3" filter="url(#insetShadow)"/>
    <rect x="66" y="272" width="176" height="176" rx="26" fill="#36393F" opacity="0.3" filter="url(#insetShadow)"/>

    <!-- Right tall tile (primary) -->
    <g filter="url(#softShadow)">
      <rect x="266" y="68" width="182" height="384" rx="30" fill="#005EB2"/>
    </g>
    <!-- Soft inset depth on right tile -->
    <rect x="270" y="72" width="174" height="376" rx="26" fill="#0070C8" opacity="0.35" filter="url(#insetShadow)"/>

    <!-- Minus glyph -->
    <rect x="120" y="155" width="72" height="12" rx="3" fill="#FFFFFF"/>

    <!-- Plus glyph -->
    <rect x="152" y="310" width="12" height="72" rx="3" fill="#FFFFFF"/>
    <rect x="117" y="345" width="72" height="12" rx="3" fill="#FFFFFF"/>

    <!-- Equals glyph -->
    <rect x="323" y="190" width="72" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="323" y="310" width="72" height="12" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- DARK VARIANT -->
  <g id="dark" visibility="hidden">
    <rect x="10" y="10" width="492" height="492" rx="56" fill="#0F141C"/>
    <g filter="url(#softShadow)">
      <rect x="62" y="68" width="184" height="184" rx="30" fill="#6B7280"/>
      <rect x="62" y="268" width="184" height="184" rx="30" fill="#6B7280"/>
      <rect x="266" y="68" width="182" height="384" rx="30" fill="#A7C8FF"/>
    </g>
    <rect x="66" y="72" width="176" height="176" rx="26" fill="#24282D" opacity="0.35" filter="url(#insetShadow)"/>
    <rect x="66" y="272" width="176" height="176" rx="26" fill="#24282D" opacity="0.35" filter="url(#insetShadow)"/>
    <rect x="270" y="72" width="174" height="376" rx="26" fill="#8CB3F5" opacity="0.3" filter="url(#insetShadow)"/>

    <!-- White glyphs for contrast on lifted charcoal and light blue -->
    <rect x="120" y="155" width="72" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="152" y="310" width="12" height="72" rx="3" fill="#FFFFFF"/>
    <rect x="117" y="345" width="72" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="323" y="190" width="72" height="12" rx="3" fill="#FFFFFF"/>
    <rect x="323" y="310" width="72" height="12" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- TINTED (grayscale for recolouring) -->
  <g id="tinted" visibility="hidden">
    <rect x="10" y="10" width="492" height="492" rx="56" fill="#B8BCC2" opacity="0.5"/>
    <g filter="url(#softShadow)">
      <rect x="62" y="68" width="184" height="184" rx="30" fill="#A0A2A8" opacity="0.85"/>
      <rect x="62" y="268" width="184" height="184" rx="30" fill="#A0A2A8" opacity="0.85"/>
      <rect x="266" y="68" width="182" height="384" rx="30" fill="#A0A2A8" opacity="0.85"/>
    </g>
    <rect x="66" y="72" width="176" height="176" rx="26" fill="#808080" opacity="0.35" filter="url(#insetShadow)"/>
    <rect x="66" y="272" width="176" height="176" rx="26" fill="#808080" opacity="0.35" filter="url(#insetShadow)"/>
    <rect x="270" y="72" width="174" height="376" rx="26" fill="#808080" opacity="0.35" filter="url(#insetShadow)"/>

    <rect x="120" y="155" width="72" height="12" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="152" y="310" width="12" height="72" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="117" y="345" width="72" height="12" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="323" y="190" width="72" height="12" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="323" y="310" width="72" height="12" rx="3" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
